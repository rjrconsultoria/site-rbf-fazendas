
backend:
  name: github
  repo: rjrconsultoria/site-rbf-fazendas
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "pt"

collections:
  - name: "fazendas"
    label: "Fazendas e Grandes Ativos"
    folder: "content/fazendas"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Nome do imóvel", name: "title", widget: "string" }
      - { label: "Região", name: "regiao", widget: "string" }
      - { label: "Preço", name: "preco", widget: "string" }
      - { label: "Área", name: "area", widget: "string" }
      - { label: "Descrição", name: "body", widget: "markdown" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Fazendas", value: "Fazendas" }
          - { label: "Grandes Ativos", value: "Grandes Ativos" }
          - { label: "Mineração", value: "Mineração" }
          - { label: "Usinas", value: "Usinas" }
          - { label: "Documentação e Regularização", value: "Documentação e Regularização" }
          - { label: "Créditos de Carbono", value: "Créditos de Carbono" }
          - { label: "Hotéis e Resorts", value: "Hotéis e Resorts" }
          - { label: "Outros Projetos", value: "Outros Projetos" }
      - { label: "Fotos", name: "fotos", widget: "list", field: { label: "Foto", name: "foto", widget: "image" } }
